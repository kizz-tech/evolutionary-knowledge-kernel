  "design": {
    "allocation": "Matched independent four-arm trajectories, randomized order and preregistered replica count with precision rationale; never recycle state across arms or replicas.",
    "transfer": "Participant B solves related but nonidentical held-out tasks with participant A's permitted results/methods, never A's personal archive or held-out answers. Replace the model only in the frozen model_replacement phase; retain the replacement through adverse.",
    "adverse": "Freeze a condition change that invalidates the acquired method. Measure detection, safe rejection/revision, time/cost, residual harm and unnecessary rejection of useful methods; preserve negative and stopped runs.",
    "human_understanding": "Separate blind human rubric: reconstruct grounds, challenge a conclusion, state applicability limits. Never infer understanding from agent task success or stored knowledge.",
    "mechanism_criteria": [
      "Transfer only a selected method version with conditions and provenance",
      "Reject prohibited private-source disclosure",
      "Detect invalid applicability under adverse condition",
      "Withdraw or revise an invalid method before reuse"
    ],
    "benefit_criteria": "Freeze product acceptance, substantial manual rework, regression/harm bounds, observation window and minimum practically relevant difference. Compare held-out outcomes and full costs; no benefit claim from mechanism replay alone.",
    "falsification": [
      "No improvement over strong baseline under equal lifecycle caps",
      "Benefit fails on participant or model replacement",
      "Obsolete methods persist or useful actions are blocked beyond frozen bounds",
      "Maintenance, failed experiments or human work consume the gain"
    ],
    "limitations": [
      "Declaration validation does not prove OS isolation or truthful observations",
      "Tasks in a trajectory are dependent",
      "Self-use and synthetic mechanism checks cannot establish general benefit",
      "No monotonic improvement, novelty, or universal scalability claim"
    ]
  },
